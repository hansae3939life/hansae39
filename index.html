<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 대시보드</title>
    <!-- 모던하고 깔끔한 Montserrat 폰트 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Pretendard:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --container-bg: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --sub-text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.25);
            --hover-bg: rgba(255, 255, 255, 0.2);
            --accent-color: #3498db;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            /* 자바스크립트로 동적 배경 설정 (기본값 설정 후 JS가 교체함) */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .dashboard {
            max-width: 1350px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 상단 검색 영역: 완전 투명 */
        .search-container {
            display: flex;
            gap: 20px;
            background: transparent;
            padding: 10px 0;
            max-width: 750px;
            margin: 0 auto;
            width: 100%;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.15);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
            background: rgba(0, 0, 0, 0.25);
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 8px 0;
            background: transparent;
            color: #ffffff;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .search-box button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            font-size: 18px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 30px;
            align-items: center;
        }

        @media (max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
            .search-container { max-width: 100%; }
        }

        .section {
            background: var(--container-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            color: #ffffff;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            justify-items: center;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s;
            width: 100%;
            padding: 8px 0;
            border-radius: 12px;
        }

        .shortcut-item:hover {
            transform: translateY(-5px);
            background-color: var(--hover-bg);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .shortcut-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .shortcut-name {
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 중앙 시계 */
        .clock-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .clock-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 5.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: transparent; 
            -webkit-text-stroke: 2px #ffffff; 
            text-shadow: 0 8px 25px rgba(0,0,0,0.6);
            line-height: 1.1;
        }

        .clock-date {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-top: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        .finance-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tradingview-widget-container {
            height: 125px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }
        
        .finance-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .finance-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub-text-color);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 상단 검색 영역 (완전 투명) -->
        <div class="search-container">
            <form class="search-box" action="https://www.google.com/search" method="GET" target="_blank">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </div>
                <input type="text" name="q" placeholder="구글 검색" required>
                <button type="submit">🔍</button>
            </form>
            
            <form class="search-box" action="https://search.naver.com/search.naver" method="GET" target="_blank">
                <div class="logo-icon" style="background:#03C75A; color:white; font-size:15px; display:flex; justify-content:center; align-items:center;">N</div>
                <input type="text" name="query" placeholder="네이버 검색" required>
                <button type="submit">🔍</button>
            </form>
        </div>

        <!-- 3단 레이아웃 -->
        <div class="main-grid">
            <!-- 좌측 사이드: 자주 찾는 사이트 -->
            <div class="section">
                <div class="section-title">⭐ 자주 찾는 사이트</div>
                <div class="shortcuts-grid">
                    <a href="https://www.youtube.com" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="유튜브"></div>
                        <span class="shortcut-name">유튜브</span>
                    </a>
                    <a href="https://www.instagram.com" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128" alt="인스타그램"></div>
                        <span class="shortcut-name">인스타</span>
                    </a>
                    <a href="https://www.sooplive.co.kr/" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=sooplive.co.kr&sz=128" alt="SOOP"></div>
                        <span class="shortcut-name">SOOP</span>
                    </a>
                    <a href="https://chzzk.naver.com/" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=chzzk.naver.com&sz=128" alt="치지직"></div>
                        <span class="shortcut-name">치지직</span>
                    </a>
                    <a href="https://section.cafe.naver.com/" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=cafe.naver.com&sz=128" alt="네이버 카페"></div>
                        <span class="shortcut-name">카페</span>
                    </a>
                    <a href="https://www.naver.com" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=naver.com&sz=128" alt="네이버"></div>
                        <span class="shortcut-name">네이버</span>
                    </a>
                    <a href="https://www.google.com" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="구글"></div>
                        <span class="shortcut-name">구글</span>
                    </a>
                    <a href="https://linkkf.app/" target="_blank" class="shortcut-item">
                        <div class="shortcut-icon"><img src="https://www.google.com/s2/favicons?domain=linkkf.app&sz=128" alt="애니메이션"></div>
                        <span class="shortcut-name">애니메이션</span>
                    </a>
                </div>
            </div>

            <!-- 중앙: 모던 폰트 테두리 시계 -->
            <div class="clock-container">
                <div class="clock-time" id="clock">00:00:00</div>
                <div class="clock-date" id="date">0000년 00월 00일 요일</div>
            </div>

            <!-- 우측 사이드: 환율 지표 -->
            <div class="section">
                <div class="section-title">📈 환율 지표</div>
                <div class="finance-grid">
                    <div class="finance-item">
                        <span class="finance-label">달러/원 환율 (USD/KRW)</span>
                        <div class="tradingview-widget-container">
                            <div class="tradingview-widget-container__widget"></div>
                            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                            { "symbol": "FX_IDC:USDKRW", "width": "100%", "colorTheme": "dark", "isTransparent": true, "locale": "kr" }
                            </script>
                        </div>
                    </div>

                    <div class="finance-item">
                        <span class="finance-label">엔/원 환율 (JPY/KRW)</span>
                        <div class="tradingview-widget-container">
                            <div class="tradingview-widget-container__widget"></div>
                            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                            { "symbol": "FX_IDC:JPYKRW", "width": "100%", "colorTheme": "dark", "isTransparent": true, "locale": "kr" }
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 배경 5개 랜덤 변경 및 실시간 시계 스크립트 -->
    <script>
        // 1. 배경 이미지 5장을 랜덤으로 선택하여 적용 (어두운 필터를 0.2로 옅게 설정)
        function setRandomBackground() {
            const bgImages = [
                'background1.jpg',
                'background2.jpg',
                'background3.jpg',
                'background4.jpg',
                'background5.jpg'
            ];
            
            const randomIndex = Math.floor(Math.random() * bgImages.length);
            const selectedBg = bgImages[randomIndex];
            
            document.body.style.background = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('${selectedBg}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
        }

        // 2. 초 단위 실시간 시계 코드
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const day = days[now.getDay()];
            
            document.getElementById('date').textContent = `${year}년 ${month}월 ${date}일 (${day})`;
        }

        setRandomBackground();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
