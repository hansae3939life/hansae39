<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 대시보드</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .category {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .category h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .link-list li {
            margin-bottom: 10px;
        }
        .link-list a {
            display: block;
            text-decoration: none;
            color: #555;
            padding: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }
        .link-list a:hover {
            background-color: #3498db;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>나만의 북마크 대시보드</h1>
    
    <div class="grid">
        <!-- 카테고리 1 -->
        <div class="category">
            <h2>자주 찾는 사이트</h2>
            <ul class="link-list">
                <li><a href="https://www.google.com" target="_blank">Google</a></li>
                <li><a href="https://www.youtube.com" target="_blank">YouTube</a></li>
                <li><a href="https://mail.google.com" target="_blank">Gmail</a></li>
            </ul>
        </div>

        <!-- 카테고리 2 -->
        <div class="category">
            <h2>어학 & 학술</h2>
            <ul class="link-list">
                <li><a href="https://papago.naver.com/" target="_blank">Papago 번역</a></li>
                <li><a href="https://en.dict.naver.com/" target="_blank">영어 사전</a></li>
                <li><a href="https://scholar.google.com/" target="_blank">Google Scholar</a></li>
            </ul>
        </div>

        <!-- 카테고리 3 -->
        <div class="category">
            <h2>디자인 & 이미지 AI</h2>
            <ul class="link-list">
                <li><a href="https://www.midjourney.com/" target="_blank">Midjourney</a></li>
                <li><a href="https://openai.com/dall-e-3" target="_blank">DALL-E</a></li>
                <li><a href="https://civitai.com/" target="_blank">Civitai</a></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
